version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm run build && npm run dev"
    environment:
      - NODE_ENV=development  
      - DATABASE_URL=mongodb+srv://akash:sJazfPDF1ZOHB6C2@cluster0.ku3wj.mongodb.net/vertx?retryWrites=true&w=majority&appName=Cluster0
      - PORT=3000
    depends_on:
      - mongo
    networks:
      - app-network


  frontend:
   build:
     context: ./frontend
     dockerfile: Dockerfile
   container_name: frontend
   restart: always
   ports:
     - 5173:5173
   volumes:
     - ./frontend:/app
     - frontend_node_modules:/app/node_modules
   networks:
     - app-network

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

volumes:
  mongodb_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge